name: Generate New Default Key

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # weekly: 0 0 * * 1 monthly: 0 0 1 * *

permissions:
  contents: write

jobs:
  rotate-key:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout entire repository with all branches
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # important to get all branches
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Setup Java
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      # Step 3: Build the project
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: ./main-repo
      
      - name: Build project
        run: ./gradlew build
        working-directory: ./main-repo

      # Step 4: Switch to default-key branch
      - name: Switch to default-key branch
        run: |
          git fetch origin default-key
          git checkout default-key

      # Step 5: Read previous version
      - name: Read previous version
        id: read_version
        run: |
          if [ -f default_key.json ]; then
            VERSION=$(jq '.version' default_key.json)
            echo "version=$((VERSION + 1))" >> $GITHUB_ENV
          else
            echo "version=1" >> $GITHUB_ENV
          fi

      # Step 6: Generate new key
      - name: Generate new key
        run: java -cp build/classes/java/main org.paul8711gamezz.helpers.KeyGenerator ${{ env.version }} > default_key.json

      # Step 7: Commit and push
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add default_key.json
          git commit -m "Rotate default key to version ${{ env.version }}" || echo "No changes to commit"
          git push origin default-key
